
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXO - Create Your Account</title>
    <link rel="stylesheet" href="css/master.css" />
  </head>
  <body>
    <!-- Full-Screen Dedicated Registration Screen -->
    <section id="auth-screen" class="auth-container register-mode">
      <!-- Top Logo -->
      <div class="auth-logo-container">
        <img
          src="assets/logo.png"
          alt="NEXO Logo"
          id="static-auth-logo"
          class="auth-logo"
        />
      </div>

      <!-- Registration View -->
      <div id="register-view" class="auth-view">
        <!-- Registration Header Text -->
        <div class="register-header-text">
          <h2>Create Your Account</h2>
          <p id="register-subtitle">
            Join NEXO and get access to scholarships and more opportunities.
          </p>
        </div>

        <!-- Locked Single Role Pill (Reads role from Login page) -->
        <div class="role-badge-container">
          <div class="role-single-badge" id="register-role-badge">Student</div>
        </div>

        <!-- Register Form -->
        <form id="register-form">
          <!-- 1. Full Name -->
          <div class="input-group" id="reg-name-group">
            <img
              src="assets/human-icon.png"
              alt="Full Name"
              class="input-icon"
              id="reg-name-icon"
            />
            <div class="input-field">
              <label for="reg-name" id="reg-name-label">Full Name</label>
              <input
                type="text"
                id="reg-name"
                placeholder="Juan Dela Cruz"
                required
              />
            </div>
          </div>

          <!-- 2. Email Address -->
          <div class="input-group" id="reg-email-group">
            <img
              src="assets/email-icon.png"
              alt="Email address"
              class="input-icon"
            />
            <div class="input-field">
              <label for="reg-email">Email address</label>
              <input
                type="email"
                id="reg-email"
                placeholder="you@university.edu.ph"
                required
              />
            </div>
          </div>
          <p class="error-text" id="reg-email-error">
            Access Denied: Only valid university emails (.edu.ph) are permitted
            for student registration.
          </p>

          <!-- 3. Create Password -->
          <div class="input-group" id="reg-pass-group">
            <img
              src="assets/password-icon.png"
              alt="Password"
              class="input-icon"
            />
            <div class="input-field">
              <label for="reg-password">Password</label>
              <input
                type="password"
                id="reg-password"
                placeholder="Create a password"
                required
              />
            </div>
            <div class="animated-eye-icon" id="toggle-reg-password">
              <svg viewBox="0 0 24 24">
                <g class="eye-open">
                  <path
                    d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"
                  />
                  <circle cx="12" cy="12" r="2.8" />
                </g>
                <path
                  class="eye-shut"
                  d="M3 10.5s3.5 5 9 5 9-5 9-5M5.8 13.6l-1.5 2M12 15.5v2.4M18.2 13.6l1.5 2"
                />
              </svg>
            </div>
          </div>

          <!-- 4. Confirm Password -->
          <div class="input-group" id="reg-confirm-group">
            <img
              src="assets/password-icon.png"
              alt="Confirm Password"
              class="input-icon"
            />
            <div class="input-field">
              <label for="reg-confirm-password">Password</label>
              <input
                type="password"
                id="reg-confirm-password"
                placeholder="Confirm password"
                required
              />
            </div>
            <div class="animated-eye-icon" id="toggle-reg-confirm">
              <svg viewBox="0 0 24 24">
                <g class="eye-open">
                  <path
                    d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"
                  />
                  <circle cx="12" cy="12" r="2.8" />
                </g>
                <path
                  class="eye-shut"
                  d="M3 10.5s3.5 5 9 5 9-5 9-5M5.8 13.6l-1.5 2M12 15.5v2.4M18.2 13.6l1.5 2"
                />
              </svg>
            </div>
          </div>
          <p class="error-text" id="reg-match-error">
            Passwords do not match. Please try again.
          </p>

          <button type="submit" class="auth-submit">Register</button>
        </form>

        <div class="auth-links">
          <p>
            Already have an account?
            <a href="index.html" class="register-link" id="show-login"
              >Log In</a
            >
          </p>
        </div>
      </div>
    </section>

    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
