<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Dashboard - NEXO</title>
    <!-- Reusing your global styles -->
    <link rel="stylesheet" href="css/master.css" />

    <!-- FIX: Destroy the invisible phantom hover box of the closed menu -->
    <style>
      #nav-menu:not(.open) {
        pointer-events: none !important;
      }
    </style>
  </head>
  <body class="dashboard-body">
    <!-- ========================================= -->
    <!-- 1. GLOBAL UNIVERSAL HEADER                -->
    <!-- ========================================= -->
    <header class="global-header">
      <!-- Profile Area -->
      <div class="logo-container">
        <!-- Using the avatar class so it keeps your exact purple circle styling -->
        <div class="avatar-btn" style="cursor: default">ST</div>
      </div>

      <!-- Action buttons container -->
      <div
        class="header-actions"
        style="display: flex; align-items: center; gap: 8px"
      >
        <!-- The Dark Mode Toggle -->
        <label class="theme-toggle-container">
          <input
            id="theme-toggle"
            class="theme-toggle"
            type="checkbox"
            aria-label="Toggle Dark Mode"
          />
        </label>

        <!-- Notification Bell -->
        <button class="icon-btn notification-btn" aria-label="Notifications">
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <span class="notification-dot"></span>
        </button>

        <!-- Clean Wrapper -->
        <div class="nav-wrapper" id="nav-wrapper" style="margin-left: 4px">
          <!-- Hamburger Button -->
          <button
            class="hamburger-btn"
            id="avatar-menu-btn"
            type="button"
            aria-label="Open Menu"
            style="z-index: 50"
            onclick="handleMenuToggle(event)"
          >
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
          </button>

          <!-- The Menu -->
          <nav
            class="nav-menu"
            id="nav-menu"
            style="overflow-y: auto; max-height: 85vh"
          >
            <span class="nav-label">MENU</span>

            <a href="student-dashboard.html" class="nav-link">
              <img
                src="assets/home-icon.png"
                alt="Home"
                class="nav-icon"
                onerror="this.style.display = 'none'"
              />
              <span class="nav-text">Home</span>
            </a>

            <a href="#!" class="nav-link" id="nav-submissions">
              <img
                src="assets/draft-icon.png"
                alt="Submissions"
                class="nav-icon"
                onerror="this.style.display = 'none'"
              />
              <span class="nav-text">View My Submissions</span>
            </a>

            <div style="margin: 8px 20px; border-top: 1px solid #e5e7eb"></div>

            <a href="student-about.html" class="nav-link">
              <img
                src="assets/about-icon.png"
                alt="About Us"
                class="nav-icon"
                onerror="this.style.display = 'none'"
              />
              <span class="nav-text">About Us</span>
            </a>

            <a href="#!" class="nav-link">
              <img
                src="assets/policy-icon.png"
                alt="Policy"
                class="nav-icon"
                onerror="this.style.display = 'none'"
              />
              <span class="nav-text">Policy</span>
            </a>
            <a href="#!" class="nav-link">
              <img
                src="assets/credits-icon.png"
                alt="Credits"
                class="nav-icon"
                onerror="this.style.display = 'none'"
              />
              <span class="nav-text">Credits</span>
            </a>

            <a href="#!" class="nav-link">
              <img
                src="assets/settings-icon.png"
                alt="Settings"
                class="nav-icon"
                onerror="this.style.display = 'none'"
              />
              <span class="nav-text">Settings</span>
            </a>

            <div style="margin: 8px 20px; border-top: 1px solid #e5e7eb"></div>

            <div class="nav-buttons">
              <a
                href="index.html"
                class="btn btn-primary logout-btn"
                style="background-color: #ef4444; border-color: #ef4444"
              >
                <img
                  src="assets/logout-icon.png"
                  alt="Logout"
                  class="nav-icon"
                  onerror="this.style.display = 'none'"
                />
                <span
                  class="nav-text"
                  style="color: white; margin: 0; font-weight: 600"
                  >Log Out</span
                >
              </a>
            </div>
          </nav>
        </div>
      </div>
    </header>

    <!-- ========================================= -->
    <!-- 2. MAIN DASHBOARD CONTENT                 -->
    <!-- ========================================= -->
    <main
      class="dash-main"
      style="
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 80vh;
      "
    >
      <!-- THE CANVAS -->
      <div style="text-align: center">
        <h1 style="color: #8b5cf6; font-size: 32px; margin-bottom: 8px">
          Student Dashboard
        </h1>
        <p style="opacity: 0.7">
          Header and Menu fully functional. Ready for content!
        </p>
      </div>
    </main>

    <script src="js/main.js"></script>
    <script src="js/student.js"></script>
  </body>
</html>
